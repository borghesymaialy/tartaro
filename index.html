<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Posizioni portafoglio</title>
<style>
:root{--A:#4fb3ff;--B:#ffa94d;--S:#c77dff}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#1d1028;color:#f4eaff;min-height:100vh}
body.bx{background:#fff}
button{font:inherit;cursor:pointer}
h1,h2,h3{margin:.3em 0}
h3{font-size:15px;color:#d9c3ff}
.wrap{max-width:1120px;margin:0 auto;padding:10px 12px 40px}
.card{background:#2c1840;border:1px solid #4a2a68;border-radius:14px;padding:14px}
.c{text-align:center}
.mini{font-size:12px;color:#bba5d9}
label{display:block;margin:10px 0 4px;color:#d9c3ff;font-size:13px}
input{font:inherit;padding:9px 11px;border-radius:9px;border:1px solid #6a3f93;background:#190c25;color:#fff;width:100%}
hr{border:0;border-top:1px solid #4a2a68;margin:14px 0}
.lob{max-width:460px;margin:30px auto}
.btn{background:#7c3aed;color:#fff;border:0;border-radius:10px;padding:9px 15px;font-weight:600}
.btn:hover:not(:disabled){background:#8f55f5}
.btn.sec{background:#3b2557}.btn.sec:hover:not(:disabled){background:#4b3070}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.tit{font-size:18px}
.chip{padding:6px 11px;border-radius:999px;background:#3b2557;border:2px solid transparent;font-weight:600;font-size:14px}
.chip.turno.A{border-color:var(--A)}.chip.turno.B{border-color:var(--B)}
.chip i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:#888}
.chip.A i{background:var(--A)}.chip.B i{background:var(--B)}
.alieno{display:flex;align-items:center;gap:8px}
.alieno .vis{font-size:30px;display:inline-block}
.alieno.agit .vis{animation:trema .35s infinite}
@keyframes trema{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px) rotate(-4deg)}75%{transform:translateX(2px) rotate(4deg)}}
.barra{width:150px;height:10px;background:#3b2557;border-radius:9px;overflow:hidden;margin-top:3px}
.barra b{display:block;height:100%;border-radius:9px;transition:width .4s}
.stato{margin:6px 2px;color:#d9c3ff}
.banner,.replaybar{background:#4b3070;border-radius:12px;padding:8px 12px;margin:8px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.barra-az{margin:10px 0;padding:10px 12px;background:#3b2557;border-radius:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.barra-az span{flex:1;min-width:200px}
/* bocca */
.bocca{position:relative;margin:14px 0;padding:56px 40px;border-radius:90px;background:radial-gradient(ellipse at 50% 40%,#a8324f,#6b1530 70%,#3d0a1b);box-shadow:inset 0 0 50px #2a0612,0 8px 30px #0008}
.bocca:before,.bocca:after{content:"";position:absolute;left:4%;right:4%;height:34px;border-radius:40px}
.bocca:before{top:8px;background:linear-gradient(#ff8fa8,#e0476e)}
.bocca:after{bottom:8px;background:linear-gradient(#e0476e,#ff8fa8)}
.sal{position:absolute;top:38px;width:9px;height:22px;border-radius:0 0 9px 9px;background:linear-gradient(rgba(190,235,255,.75),rgba(190,235,255,.25));animation:drip 3.4s ease-in infinite;pointer-events:none;z-index:1}
@keyframes drip{0%{transform:scaleY(.3);transform-origin:top;opacity:1}60%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1.5) translateY(14px);opacity:0}}
#tavolo{position:relative;display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:7px;z-index:2}
#tavolo.nocur{cursor:none}
#tavolo.nocur .dente{cursor:none}
.dente{position:relative;aspect-ratio:40/50;border:0;background:none;padding:0;color:inherit}
.dente svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 2px 2px #0007);transition:transform .15s}
.dente.sel svg{transform:translateY(-6px) scale(1.1);filter:drop-shadow(0 0 6px #fff)}
.dente.area svg{filter:brightness(1.2) drop-shadow(0 0 6px #7df)}
.dente.no:not(.rim){opacity:.38}
.dente.nota:before{content:"?";position:absolute;left:1px;top:-3px;font-weight:800;color:#ffe066;text-shadow:0 1px 2px #000;z-index:3}
.dente:after{content:"";position:absolute;inset:-4px;border-radius:12px;pointer-events:none}
.dente.u-A:after{border:3px solid var(--A)}.dente.u-B:after{border:3px solid var(--B)}.dente.u-S:after{border:3px dashed var(--S)}
.dente .bd{position:absolute;top:-8px;right:-5px;font-style:normal;font-size:15px;line-height:1;text-shadow:0 1px 2px #000;z-index:4}
.dente .rf{position:absolute;left:0;right:0;bottom:-13px;font-size:9px;color:#ffc8d8;opacity:.8;pointer-events:none}
.dito{position:absolute;pointer-events:none;z-index:20;width:30px;transform:translate(-50%,-3px) rotate(-14deg);transform-origin:50% 0;filter:drop-shadow(0 3px 3px #0008)}
.dito.avv{opacity:.92}
.dito svg{width:100%;height:auto;display:block}
/* pannelli */
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
@media(max-width:760px){.cols2{grid-template-columns:1fr}.bocca{padding:44px 14px;border-radius:50px}#tavolo{gap:3px}.dente .rf{display:none}}
.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tool{background:#3b2557;border:2px solid transparent;border-radius:12px;color:#fff;padding:8px 10px;text-align:left;display:flex;flex-direction:column;gap:1px}
.tool.on{border-color:#c4a1ff;background:#4b3070}
.tool:disabled{opacity:.4;cursor:not-allowed}
.tool small{color:#bba5d9}
.usato{opacity:.25;text-decoration:line-through}
.rg{padding:5px 0;border-bottom:1px solid #4a2a68;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.rg i{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:none}
.rg.nuovo{font-weight:700;color:#fff}
.radio{margin:8px 0 0;padding-left:18px;font-size:13px}
/* overlay fine */
.ov{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.ovbox{background:#2c1840;border-radius:18px;padding:18px;max-width:520px;width:100%;text-align:center;color:#f4eaff}
.scena .su{animation:su .35s .3s cubic-bezier(.6,0,1,1) both}
.scena .giu{animation:giu .35s .3s cubic-bezier(.6,0,1,1) both}
@keyframes su{from{transform:translateY(-55px)}to{transform:translateY(0)}}
@keyframes giu{from{transform:translateY(55px)}to{transform:translateY(0)}}
.scena .punta{transform-box:fill-box;transform-origin:center;animation:vola 1.1s .62s ease-out both}
@keyframes vola{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(-70px,-90px) rotate(-75deg);opacity:0}}
.scena .snap{transform-box:fill-box;transform-origin:center;animation:pop .5s .62s both}
@keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111e;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:99;max-width:90%;text-align:center}
#toast.on{opacity:1}
/* excel */
.xl{background:#fff;color:#222;font-family:Calibri,"Segoe UI",Arial,sans-serif;font-size:12px;min-height:100vh;padding-bottom:40px}
.xl button{font-family:inherit}
.xl-title{background:#217346;color:#fff;padding:5px 10px}
.xl-tabs{display:flex;background:#f3f3f3;border-bottom:1px solid #d0d0d0;overflow-x:auto}
.xl-tabs span{padding:6px 14px;color:#333;cursor:default;white-space:nowrap}
.xl-tabs span.on{background:#fff;border:1px solid #d0d0d0;border-bottom:0;color:#217346;font-weight:600}
.xl-tabs span.vis{cursor:pointer}
.xl-rib{display:flex;gap:6px;border-bottom:1px solid #d0d0d0;padding:6px 10px;min-height:66px;align-items:stretch;overflow-x:auto}
.xl-grp{border-right:1px solid #e0e0e0;padding:0 10px;display:flex;flex-direction:column;justify-content:space-between}
.xl-grp>b{font-weight:400;color:#777;font-size:10px;text-align:center}
.xl-btns{display:flex;gap:4px}
.xl-b{border:1px solid transparent;background:none;padding:3px 8px;font-size:11px;color:#222;border-radius:3px;min-width:64px;line-height:1.3}
.xl-b span{font-size:16px;color:#217346}
.xl-b:hover:not(:disabled){background:#e5f1ea;border-color:#b6d7c3}
.xl-b.on{background:#cfe7d9;border-color:#217346}
.xl-b:disabled{color:#aaa}.xl-b:disabled span{color:#bbb}
.xl-f{display:flex;align-items:center;border-bottom:1px solid #d0d0d0;height:24px}
.xn{width:70px;border-right:1px solid #d0d0d0;padding:0 8px;line-height:24px}
.xfx{padding:0 10px;font-style:italic;color:#555;border-right:1px solid #d0d0d0;line-height:24px}
.xval{padding:0 8px;white-space:nowrap;overflow:hidden}
.kpi{display:flex;gap:10px;padding:8px 10px;flex-wrap:wrap}
.kpi div{border:1px solid #d9d9d9;border-radius:3px;padding:4px 12px;background:#fafafa}
.kpi small{display:block;color:#777;font-size:10px}
.kpi b{font-size:16px;color:#217346}
.xsheet{display:grid;grid-template-columns:34px 1fr;overflow-x:auto;margin:0 10px}
.xcorner,.xh,.xr{background:#e8e8e8;border:1px solid #d0d0d0;text-align:center;color:#444;line-height:22px;height:24px}
.xhead,.xg{display:grid;grid-template-columns:repeat(var(--cols),minmax(52px,1fr))}
.xg{grid-auto-rows:24px;position:relative}
.xc{border:1px solid #e3e3e3;text-align:right;padding:0 6px;line-height:22px;font-variant-numeric:tabular-nums;position:relative;user-select:none;cursor:cell}
.xc.xe{cursor:default}
.xc:hover:not(.xe){outline:2px solid #217346;outline-offset:-2px}
.xc.u-A{background:#dbeeff}.xc.u-B{background:#ffe8cf}.xc.u-S{background:#ead9ff}
.xc.sel{outline:2px solid #217346;outline-offset:-2px;background:#e5f4ea}
.xc.area{background:#e5f4ea}
.xc.rim{color:#aaa}.xc.mio{font-weight:700}.xc.no:not(.rim){color:#999}
.xc.com:after{content:"";position:absolute;top:0;right:0;border-style:solid;border-width:0 7px 7px 0;border-color:transparent #d00 transparent transparent}
.xdito{position:absolute;pointer-events:none;border:2px solid #217346;z-index:5}
.xl-status{background:#f3f3f3;border-top:1px solid #d0d0d0;border-bottom:1px solid #d0d0d0;margin:10px 10px 0;padding:4px 10px;display:flex;gap:10px;align-items:center;min-height:30px;flex-wrap:wrap}
.xl .barra-az{margin:0;padding:0;background:none;flex:1}
.xl .btn{background:#217346;border-radius:3px;padding:3px 12px;font-weight:400}.xl .btn.sec{background:#e6e6e6;color:#222}
.xl .banner,.xl .replaybar{background:#fff7d6;border:1px solid #e6d58a;border-radius:3px;margin:8px 10px;color:#333}
.xl h3{color:#217346;font-size:13px;margin:14px 10px 4px}
.xl .rg{padding:3px 10px;border-bottom:1px solid #eee;color:#333}
.xl .rg i{display:none}
.xl .rg.nuovo{color:#000}
.xl-sheets{display:flex;gap:2px;margin:12px 10px 0}
.xl-sheets span{padding:4px 14px;border:1px solid #d0d0d0;border-top:0;background:#f3f3f3;color:#444}
.xl-sheets span.on{background:#fff;color:#217346;font-weight:600}
.xdlg{background:#f0f0f0;color:#222;border-radius:4px;text-align:left;font-family:Calibri,"Segoe UI",Arial,sans-serif}
.xdt{background:#fff;border-bottom:1px solid #ddd;margin:-18px -18px 12px;padding:8px 12px;border-radius:4px 4px 0 0}
/* excel finto */
#excelFinto{position:fixed;inset:0;z-index:100;background:#fff;overflow:auto;color:#222;font-family:Calibri,"Segoe UI",Arial,sans-serif;font-size:12px}
#excelFinto table{border-collapse:collapse;width:100%;min-width:700px}
#excelFinto td,#excelFinto th{border:1px solid #d9d9d9;padding:2px 8px;height:21px;white-space:nowrap}
#excelFinto th{background:#e8e8e8;font-weight:400;color:#444}
#excelFinto td.n{background:#e8e8e8;text-align:center;color:#444;width:34px}
#excelFinto td.r{color:#c00;font-weight:600}
#excelFinto .hd{background:#d9ead3;font-weight:600}
</style>
</head>
<body>
<div id="app"></div>
<div id="excelFinto" hidden></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ===== LOGICA-INIZIO ===== */
const COL='ABCDEFGHIJKL';
const altro=r=>r==='A'?'B':'A';
const clona=o=>JSON.parse(JSON.stringify(o));
const ref=(s,id)=>COL[id%s.config.colonne]+(Math.floor(id/s.config.colonne)+1);
const attivo=d=>d.stato==='attivo';
const coronato=(s,d)=>d.corona_fino_a!==null&&s.turno_n<=d.corona_fino_a;
const FORME=['incisivo','incisivo','incisivo','incisivo','canino','canino','molare','molare','molare','stella','cubo','baffo','occhio'];
function mescola(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pesca(a,n){return mescola(a).slice(0,n);}

function nuovoStato(nomeA,nomeB){
  const config={righe:3,colonne:12,pazienza_max:10,cadute_per_round:2,inizio_cadute_round:2,durata_corona:3};
  const tot=config.righe*config.colonne,denti=[];
  for(let i=0;i<tot;i++)denti.push({id:i,forma:FORME[Math.floor(Math.random()*FORME.length)],stato:'attivo',motivo_rimozione:null,corona_fino_a:null});
  const giocatore=nome=>({nome:nome||null,dente_cariato:null,strumenti:{trapianto:true,radiografia:true,corona:true,estrazione:true},radiografie:[]});
  return {config,fase:nomeB?'setup':'attesa',giocatori:{A:giocatore(nomeA),B:giocatore(nomeB)},denti,turno:null,turno_n:0,mosse_round:0,round:1,pazienza:config.pazienza_max,ultima_mossa:null,registro:[],vincitore:null,perdente:null,rivincita:null};
}
function premibili(s,r){const mio=s.giocatori[r].dente_cariato;return s.denti.filter(d=>attivo(d)&&!coronato(s,d)&&d.id!==mio).map(d=>d.id);}
function candidatiSani(s){const a=s.giocatori.A.dente_cariato,b=s.giocatori.B.dente_cariato;return s.denti.filter(d=>attivo(d)&&!coronato(s,d)&&d.id!==a&&d.id!==b).map(d=>d.id);}
function area(s,c){
  const R=s.config.righe,C=s.config.colonne,r=Math.floor(c/C),k=c%C;
  const r0=Math.max(0,r-1),r1=Math.min(R-1,r+1),k0=Math.max(0,k-1),k1=Math.min(C-1,k+1),ids=[];
  for(let i=r0;i<=r1;i++)for(let j=k0;j<=k1;j++)ids.push(i*C+j);
  return {ids,range:ref(s,r0*C+k0)+':'+ref(s,r1*C+k1)};
}
function puoAgire(s,r){
  if(premibili(s,r).length)return true;
  const st=s.giocatori[r].strumenti,att=s.denti.filter(d=>attivo(d)&&!coronato(s,d));
  return st.radiografia||st.estrazione||(st.corona&&att.length>0)||(st.trapianto&&att.length>1);
}
function turnoMio(s,r){return s.fase==='gioco'&&s.turno===r;}

function scegliCariato(s,r,id){
  if(s.fase!=='setup')return {errore:'La fase di preparazione è finita.'};
  const g=s.giocatori[r];
  if(g.dente_cariato!==null)return {errore:'Hai già scelto il tuo dente.'};
  if(!s.denti[id]||!attivo(s.denti[id]))return {errore:'Dente non valido.'};
  g.dente_cariato=id;
  if(s.giocatori.A.dente_cariato!==null&&s.giocatori.B.dente_cariato!==null){
    s.fase='gioco';s.turno=Math.random()<0.5?'A':'B';s.turno_n=1;s.mosse_round=0;
    s.registro.push({n:0,giocatore:'S',tipo:'inizio',denti:[],testo:'Si comincia: muove '+s.giocatori[s.turno].nome,gergo:'Sessione avviata: '+s.giocatori[s.turno].nome});
  }
  return {ok:true};
}

function fineRound(s){
  s.mosse_round=0;
  const fatto=s.round;
  s.round++;
  s.pazienza=Math.max(0,s.pazienza-1);
  if(s.pazienza===0){
    s.fase='fine';s.perdente=s.turno;s.vincitore=altro(s.turno);
    const nome=s.giocatori[s.turno].nome;
    s.registro.push({n:s.turno_n-1,giocatore:'S',tipo:'fine',denti:[],testo:'Pazienza esaurita: la bocca si chiude su '+nome,gergo:'Timeout sessione: '+nome});
    return;
  }
  if(fatto>=s.config.inizio_cadute_round){
    const sc=pesca(candidatiSani(s),s.config.cadute_per_round);
    sc.forEach(id=>{s.denti[id].stato='rimosso';s.denti[id].motivo_rimozione='caduto';});
    if(sc.length){
      if(s.ultima_mossa)s.ultima_mossa.cadute=sc;
      const l=sc.map(i=>ref(s,i)).join(', ');
      s.registro.push({n:s.turno_n-1,giocatore:'S',tipo:'cadute',denti:sc,testo:'Il cliente perde pazienza: cadono '+l,gergo:'Archiviazione automatica: '+l});
    }
  }
}
function avanzaTurno(s,r){
  s.turno_n++;s.mosse_round++;s.turno=altro(r);
  if(s.mosse_round>=2)fineRound(s);
  let guard=0;
  while(s.fase==='gioco'&&!puoAgire(s,s.turno)&&guard++<60){
    const p=s.turno,nome=s.giocatori[p].nome;
    s.registro.push({n:s.turno_n,giocatore:p,tipo:'passa',denti:[],testo:nome+' non ha mosse: passa il turno',gergo:'Nessuna operazione disponibile ('+nome+')'});
    s.turno_n++;s.mosse_round++;s.turno=altro(p);
    if(s.mosse_round>=2)fineRound(s);
  }
  if(s.registro.length>40)s.registro.splice(0,s.registro.length-40);
}
function chiudiAzione(s,r,mossa,testo,gergo){
  const n=s.turno_n;
  s.ultima_mossa=Object.assign({n:n,giocatore:r},mossa);
  s.registro.push({n:n,giocatore:r,tipo:mossa.tipo,denti:mossa.denti||[],testo:testo,gergo:gergo});
  if(mossa.tipo==='premi'&&mossa.esito==='cariato'){s.fase='fine';s.perdente=r;s.vincitore=altro(r);return;}
  avanzaTurno(s,r);
}
function premi(s,r,id,traccia){
  if(!turnoMio(s,r))return {errore:'Non è il tuo turno.'};
  const d=s.denti[id];
  if(!d||!attivo(d)||coronato(s,d)||id===s.giocatori[r].dente_cariato)return {errore:'Quel dente non si può premere.'};
  const nome=s.giocatori[r].nome;
  if(id===s.giocatori[altro(r)].dente_cariato){
    chiudiAzione(s,r,{tipo:'premi',denti:[id],esito:'cariato',traccia:traccia||[]},nome+' preme il dente '+ref(s,id)+': scatta il nervo!','Errore #RIF! su '+ref(s,id)+': operazione annullata');
    return {ok:true,esito:'cariato'};
  }
  d.stato='rimosso';d.motivo_rimozione='curato';
  chiudiAzione(s,r,{tipo:'premi',denti:[id],esito:'sano',traccia:traccia||[]},nome+' cura il dente '+ref(s,id),'Posizione '+ref(s,id)+' riconciliata');
  return {ok:true,esito:'sano'};
}
function trapianto(s,r,a,b,traccia){
  if(!turnoMio(s,r))return {errore:'Non è il tuo turno.'};
  const g=s.giocatori[r];
  if(!g.strumenti.trapianto)return {errore:'Trapianto già usato.'};
  const da=s.denti[a],db=s.denti[b];
  if(a===b||!da||!db||!attivo(da)||!attivo(db)||coronato(s,da)||coronato(s,db))return {errore:'Questi denti non si possono scambiare.'};
  g.strumenti.trapianto=false;
  const spostati=[];
  ['A','B'].forEach(p=>{const q=s.giocatori[p];if(q.dente_cariato===a){q.dente_cariato=b;spostati.push(p);}else if(q.dente_cariato===b){q.dente_cariato=a;spostati.push(p);}});

/* ---------- dito: registrazione, live, replay ---------- */
function campiona(x,y){
  const now=performance.now();
  x=Math.min(1,Math.max(0,x));y=Math.min(1,Math.max(0,y));
  if(canale&&now-ultimoLive>70){ultimoLive=now;try{canale.send({type:'broadcast',event:'dito',payload:{r:ruolo,x:r3(x),y:r3(y)}});}catch(e){}}
  ultimaPos={x:x,y:y};
  if(ultimoCamp===null){ultimoCamp=now;tAcc=0;traccia.push([0,r3(x),r3(y)]);return;}
  if(now-ultimoCamp<80)return;
  tAcc+=Math.min(now-ultimoCamp,2000);ultimoCamp=now;
  traccia.push([Math.round(tAcc),r3(x),r3(y)]);
  if(traccia.length>200)traccia=traccia.filter((_,i)=>i%2===0||i===traccia.length-1);
}
function posizionaDitoAvv(x,y){
  const el=document.getElementById('ditoAvv');if(!el||!S)return;
  el.style.display='block';
  if(vista==='excel'){
    const C=S.config.colonne,R=S.config.righe,c=Math.min(C-1,Math.floor(x*C)),r=Math.min(R-1,Math.floor(y*R));
    el.style.left=(c*100/C)+'%';el.style.top=(r*100/R)+'%';el.style.width=(100/C)+'%';el.style.height=(100/R)+'%';
  }else{el.style.left=(x*100)+'%';el.style.top=(y*100)+'%';}
}

  clearTimeout(hideT);hideT=setTimeout(nascondiDitoAvv,1600);
}
function replayPendente(){

  return !!(u&&u.giocatore!==ruolo&&u.n>replayVisto&&u.traccia&&u.traccia.length>1&&(S.fase==='gioco'||S.fase==='fine'));

function controllaReplay(){
  if(!S||schermata!=='partita'||replayInCorso||document.visibilityState!=='visible')return false;
  const u=S.ultima_mossa;
  if(!u||u.n<=replayVisto)return false;

  if(replayPendente()){avviaReplay();return true;}
  return false;
}
function avviaReplay(){
  const u=S.ultima_mossa;
  if(!u||!u.traccia||u.traccia.length<2)return;
  const tr=u.traccia;
  replayInCorso=true;liveRicevuti=0;render();
  const t0=performance.now(),tot=tr[tr.length-1][0],vel=2;
  function f(now){
    if(!replayInCorso)return;
    try{
      const t=(now-t0)*vel;
      let i=0;while(i<tr.length-1&&tr[i+1][0]<=t)i++;
      let x=tr[i][1],y=tr[i][2];
      if(i<tr.length-1){const a=tr[i],b=tr[i+1],k=Math.min(1,(t-a[0])/Math.max(1,b[0]-a[0]));x=a[1]+(b[1]-a[1])*k;y=a[2]+(b[2]-a[2])*k;}
      posizionaDitoAvv(x,y);
      if(t>=tot+700){fineReplay();return;}
      requestAnimationFrame(f);
    }catch(e){fineReplay();}
  }
  requestAnimationFrame(f);
}
function fineReplay(){
  if(!replayInCorso)return;
  replayInCorso=false;
  const u=S&&S.ultima_mossa;

  let t='',ok=false;
  switch(modo){
    case 'premi':t=sel.length?tx('Premere il dente '+r(sel[0])+'?','Riconciliare la posizione '+r(sel[0])+'?'):tx('Clicca un dente per premerlo, oppure usa uno strumento.','Seleziona una posizione o usa una funzione.');ok=sel.length===1;break;
    case 'trapianto':t=sel.length===2?tx('Scambiare '+r(sel[0])+' con '+r(sel[1])+'?','Riconciliare '+r(sel[0])+' con '+r(sel[1])+'?'):tx('Trapianto: scegli '+(sel.length?'il secondo':'il primo')+' dente.','Riconcilia: seleziona '+(sel.length?'la seconda':'la prima')+' posizione.');ok=sel.length===2;break;
    case 'radiografia':t=sel.length?tx('Radiografare l\'area '+area(S,sel[0]).range+'? (risposta SÌ/NO solo per te)','Verificare l\'area '+area(S,sel[0]).range+'?'):tx('Radiografia: scegli il centro dell\'area 3×3.','Verifica area: seleziona il centro.');ok=sel.length===1;break;
    case 'corona':t=sel.length?tx('Mettere la Corona su '+r(sel[0])+' per 3 turni?','Bloccare '+r(sel[0])+' per 3 turni?'):tx('Corona: scegli il dente da bloccare.','Blocca: seleziona una posizione.');ok=sel.length===1;break;
    case 'estrazione':t=tx('Estrarre 2 denti sani a caso? Il tavolo si restringe anche per te.','Scartare 2 posizioni a caso?');ok=true;break;
  }
  return barra(t,ok,ok||modo!=='premi');
}

/* ---------- eventi ---------- */
document.addEventListener('click',e=>{
  if(!e.target||!e.target.closest)return;
  const d=e.target.closest('[data-dente]');
  if(d&&S&&schermata==='partita'){clickDente(+d.dataset.dente);return;}
  const a=e.target.closest('[data-act]');
  if(a)azione(a.dataset.act,a);
});
document.addEventListener('contextmenu',e=>{
  if(!e.target||!e.target.closest)return;
  const d=e.target.closest('[data-dente]');
  if(d&&S&&schermata==='partita'){
    e.preventDefault();
    const id=+d.dataset.dente;
    if(note.has(id))note.delete(id);else note.add(id);
    ls.s('tartaro:'+code+':note',JSON.stringify(Array.from(note)));
    render();
  }
});
document.addEventListener('mousemove',e=>{
  if(!S||schermata!=='partita')return;
  const tav=document.getElementById('tavolo');if(!tav)return;
  const rc=tav.getBoundingClientRect();
  const dentro=e.clientX>=rc.left&&e.clientX<=rc.right&&e.clientY>=rc.top&&e.clientY<=rc.bottom&&rc.width>0&&rc.height>0;
  const dm=document.getElementById('ditoMio');
  if(dm){
    if(dentro&&vista==='bocca'){dm.style.display='block';dm.style.left=(e.clientX-rc.left)+'px';dm.style.top=(e.clientY-rc.top)+'px';}
    else dm.style.display='none';
  }
  if(modo==='radiografia'&&mioTurno()&&!sel.length){
    const el=e.target&&e.target.closest?e.target.closest('[data-dente]'):null;
    evidenziaArea(el?+el.dataset.dente:null);
  }
  if(!dentro||!mioTurno()||document.hidden)return;
  campiona((e.clientX-rc.left)/rc.width,(e.clientY-rc.top)/rc.height);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){const f=$('#excelFinto');if(f)f.hidden=!f.hidden;}
  if(e.key==='Enter'&&schermata==='lobby'&&e.target&&e.target.id==='inCodice')entra(e.target.value);
});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&S&&schermata==='partita'){sync();if(!controllaReplay())render();}
});
